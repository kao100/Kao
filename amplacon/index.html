<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AMPLA — mudou de endereço</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #EEF2F8; color: #15202F; text-align: center; padding: 24px;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .caixa { max-width: 420px; }
  svg { display: block; margin: 0 auto 18px; }
  h1 { font-size: 19px; margin: 0 0 8px; }
  p { color: #3D4B60; margin: 0 0 18px; }
  a {
    display: inline-block; background: #0044B9; color: #fff; text-decoration: none;
    padding: 13px 22px; border-radius: 12px; font-weight: 700;
  }
  .mini { font-size: 13px; color: #6B7A91; margin-top: 18px; }
</style>
</head>
<body>
  <div class="caixa">
    <svg width="64" height="33" viewBox="0 0 100 51.45" aria-hidden="true">
      <path d="M50 0 L100 34.91 L100 51.45 L50 21.64 L0 51.45 L0 34.91 Z" fill="#0044B9"/>
    </svg>
    <h1>O aplicativo agora é AMPLA</h1>
    <p>Mudou de endereço junto com o nome. Seus dados vêm junto — nada se perde.</p>
    <a href="../ampla/" id="ir">Abrir o AMPLA</a>
    <p class="mini">
      Se você tinha o ícone na tela de início, apague ele e adicione de novo
      pelo endereço novo.
    </p>
  </div>

<script>
  // O app antigo deixou um service worker registrado neste endereço. Sem tirar
  // ele, o iPhone continuaria servindo a versão velha do cache mesmo depois da
  // mudança — e a pessoa acharia que nada foi atualizado.
  (async () => {
    try {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs
          .filter((r) => r.scope.includes('/amplacon/'))
          .map((r) => r.unregister()));
      }
      if (window.caches) {
        const nomes = await caches.keys();
        await Promise.all(nomes.filter((n) => n.startsWith('amplacon-')).map((n) => caches.delete(n)));
      }
    } catch (e) { /* seguir em frente: o link abaixo funciona de qualquer jeito */ }
    location.replace(new URL('../ampla/', location.href).href);
  })();
</script>
</body>
</html>
